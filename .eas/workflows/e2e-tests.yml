name: Native E2E tests

on:
  workflow_dispatch:

jobs:
  build_android:
    type: build
    params:
      platform: android
      profile: e2e-test

  test_android:
    needs:
      - build_android
    type: maestro
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path:
        - .maestro/customer-booking-flow.yaml
        - .maestro/host-booking-management-flow.yaml

  build_ios:
    type: build
    params:
      platform: ios
      profile: e2e-test

  test_ios:
    needs:
      - build_ios
    type: maestro
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path:
        - .maestro/customer-booking-flow.yaml
        - .maestro/host-booking-management-flow.yaml
